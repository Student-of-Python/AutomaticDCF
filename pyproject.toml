[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dcf-model"
version = "0.1.0"
description = "Automated Discounted Cash Flow (DCF) Valuation Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "curl_cffi>=0.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "openpyxl>=3.1.2",
    "pydantic>=2.5.0",
    "lxml>=5.0.0",
    "html5lib>=1.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
dcf = "app.external.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["img*", "test*"]
